<!DOCTYPE html>
 <html lang="es">
     <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Título</title> 
        <link rel="stylesheet" href="taller.css">
    </head> 
    
    <body> 
        <script src="taller.js" defer></script> 

    <form action="">
     <ul>

    <li>
      <label for="nombreCompleto">Nombre:</label>
     <input type="text" id="nombreCompleto"  name="nombreCompleto" minlength="1" maxlength="50" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" required placeholder="Ej: Juan Pérez"/> 
    </li>

    <li>
      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" min="1" max="120" placeholder="Ej: 19" required/>
    </li>

    <li>
      <label for="tipoDocumento">Tipo de Documento:</label>
        <select name="tipoDocumento" id="tipoDocumento" required>
            <option value="RC">Registro Civil</option>
            <option value="TI">TI</option>
            <option value="CC">CC</option>
            <option value="CE">CE</option>  
            <option value="PP">PP</option>  
        </select>
    </li>

    <li>
        <label for="numeroDocumento" > Número de Documento: </label>
        <input type="text" id="numeroDocumento" name="numeroDocumento" minlength="9" maxlength="10" pattern="[0-9]+" required placeholder="Ej: 1023456789"/>
    </li>

<li>
    <label for="salario">Salario:</label>
    <input type="number" id="salario" name="salario" min="0" step="0.01" required placeholder="Ej: 1500000"/>
</li>

<li>
    <label for="comisiones">Comisiones:</label>
    <input  type="number" id="comisiones" name="comisiones" min="0" step="0.01" value="0" placeholder="Ej: 300000"/>
</li>

<li>
    <label for="horasExtras">Horas Extras:</label>
    <input  type="number" id="horasExtras" name="horasExtras" min="0" step="0.01" value="0" placeholder="Ej: 120000"/>
</li>

<li>
    <label for="nivelRiesgo">Nivel de Riesgo:</label>
    <select id="nivelRiesgo" name="nivelRiesgo" required>
        <option value="">Seleccione una opción</option>
        <option value="1">Riesgo Mínimo</option>
        <option value="2">Riesgo Bajo</option>
        <option value="3">Riesgo Medio</option>
        <option value="4">Riesgo Alto</option>
        <option value="5">Riesgo Máximo</option>
    </select>
</li>

 <li>
     <button type="submit">Enviar Formulario</button>
    </li>


     </ul>
    </form>


    </body>
  </html>
